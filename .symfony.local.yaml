# Configuration du serveur local Symfony CLI (`symfony serve -d`).
# Ce worker traite les e-mails (transport async) et les tâches planifiées (transport scheduler_default).
workers:
    messenger_consume:
        cmd: ['symfony', 'console', 'messenger:consume', 'async', 'scheduler_default', '--time-limit=3600', '-vv']
        watch: ['config', 'src', 'templates', 'vendor/composer/installed.json']
